<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8457">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Personal ERP</title>
<style>
:root{--bg:#f3f7f5;--card:#ffffff;--card2:#e9f0ec;--text:#12201a;--muted:#5f6f66;--primary:#0b8457;--on-primary:#ffffff;--gold:#c9a227;--danger:#c0392b;--ok:#0b8457;--warn:#b7791f;--info:#2b6cb0;--border:#d9e3dd;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1512;--card:#16211c;--card2:#1d2b25;--text:#e8f0ec;--muted:#93a69c;--primary:#2fbf8a;--on-primary:#04231a;--gold:#e0bd48;--danger:#ff7b6b;--ok:#2fbf8a;--warn:#e6b54d;--info:#63b3ed;--border:#2a3a33;--shadow:none}}
:root[data-theme="dark"]{--bg:#0d1512;--card:#16211c;--card2:#1d2b25;--text:#e8f0ec;--muted:#93a69c;--primary:#2fbf8a;--on-primary:#04231a;--gold:#e0bd48;--danger:#ff7b6b;--ok:#2fbf8a;--warn:#e6b54d;--info:#63b3ed;--border:#2a3a33;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 8px 16px;display:flex;align-items:center;gap:4px}
header.top h1{font-size:21px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:4px 16px 16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;max-width:760px;margin:0 auto}
nav.bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button .ic{font-size:20px}
nav.bottom button.on{color:var(--primary);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px}
.hero{background:linear-gradient(135deg,var(--primary),#065f3f);color:#fff;border:0}
.hero .lbl{opacity:.85;font-size:13px}.hero .big{font-size:24px;font-weight:800}.hero .cd{font-size:15px;opacity:.95;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--danger)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ico{width:36px;height:36px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.row .mid{flex:1;min-width:0}.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 2px 4px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);margin-right:4px}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.chip.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;padding:8px 10px;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.btn{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{display:block;width:100%;margin-bottom:8px;text-align:center}
.icon{border:0;background:none;font-size:20px;padding:6px 10px;border-radius:10px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--gold);color:#241c00;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:7}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar select,.toolbar input{flex:1;min-width:0}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
textarea{resize:vertical}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chk input{width:20px;height:20px}
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:relative;background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sh-h h2{margin:0;font-size:19px}
.sh-f{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sh-f .btn.primary{flex:1}
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.col{flex:0 0 86%;scroll-snap-align:start;background:var(--card2);border-radius:16px;padding:10px;min-height:120px}
@media(min-width:640px){.col{flex:1 0 31%}}
.col h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.tcard .ttl{font-weight:600;margin-bottom:4px}.tcard .mv{display:flex;justify-content:space-between;margin-top:6px}
.pdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.ps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ps button{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.ps button.on.ontime{background:var(--ok);color:#fff;border-color:var(--ok)}
.ps button.on.late{background:var(--warn);color:#fff;border-color:var(--warn)}
.ps button.on.qaza{background:var(--info);color:#fff;border-color:var(--info)}
.ps button.on.missed{background:var(--danger);color:#fff;border-color:var(--danger)}
.wk{width:100%;border-collapse:collapse;font-size:12px;text-align:center}.wk td,.wk th{padding:5px 2px}.wk th{color:var(--muted);font-weight:700}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--card2);border:1px solid var(--border)}
.dot.ontime{background:var(--ok);border-color:var(--ok)}.dot.late{background:var(--warn);border-color:var(--warn)}.dot.qaza{background:var(--info);border-color:var(--info)}.dot.missed{background:var(--danger);border-color:var(--danger)}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.hb .n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.hb .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.hb .v{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bars .g{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bars .pair{display:flex;align-items:flex-end;gap:3px;flex:1;min-height:0;width:100%;justify-content:center}
.bars .pair i{display:block;width:38%;min-height:2px;border-radius:5px 5px 0 0}
.bars .lb{font-size:11px;color:var(--muted);margin-top:4px}
.i-inc{background:var(--ok)}.i-exp{background:var(--gold)}
.hd{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}.hd i{width:14px;height:14px;border-radius:4px;background:var(--card2);display:block}.hd i.on{background:var(--primary)}
.hab{display:flex;align-items:center;gap:10px}.hab .cnt{display:flex;align-items:center;gap:6px}
.banner{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top));z-index:30;max-width:736px;margin:0 auto}
.toast{background:#1f2b26;color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px}
.toast.alert{background:var(--gold);color:#241c00;font-weight:700}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;max-width:736px;margin:0 auto;pointer-events:none}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}.kv:last-child{border-bottom:0}
svg.line{width:100%;height:120px}
a{color:var(--primary)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div class="banner" id="banner"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   Personal ERP - offline-first, single file. All data stays on this device.
   ===================================================================== */
const APP_FORMAT = 'personal-erp-html-backup';
const SCHEMA = 1;
const PRAYERS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
const PNAME = { fajr: 'Fajr', dhuhr: 'Dhuhr', asr: 'Asr', maghrib: 'Maghrib', isha: 'Isha' };
const CATS_EXP = ['Food', 'Transport', 'Bills', 'Family', 'Health', 'Education', 'Other'];
const CATS_INC = ['Salary', 'Business', 'Other income'];
const CITIES = {
  'Shahdadpur': [25.925, 68.623], 'Karachi': [24.8607, 67.0011], 'Hyderabad': [25.396, 68.3578],
  'Sukkur': [27.7052, 68.8574], 'Larkana': [27.557, 68.2141], 'Nawabshah': [26.2483, 68.4096],
  'Mirpur Khas': [25.5276, 69.0111], 'Lahore': [31.5204, 74.3587], 'Islamabad': [33.6844, 73.0479],
  'Multan': [30.1575, 71.5249], 'Faisalabad': [31.4504, 73.135], 'Quetta': [30.1798, 66.975],
  'Peshawar': [34.0151, 71.5249]
};
const COLL = ['accounts', 'categories', 'txns', 'prayerLogs', 'schedules', 'projects', 'tasks', 'journal',
  'books', 'ideas', 'workouts', 'metrics', 'habits', 'habitLogs', 'contacts', 'interactions', 'followUps', 'assets'];
const MOODS = { 1: '😞', 2: '😕', 3: '😐', 4: '🙂', 5: '😄' };
const PRIO = { low: 1, medium: 2, high: 3, urgent: 4 };
const COLORS = { green: '#0b8457', gold: '#c9a227', blue: '#2b6cb0', red: '#c0392b', purple: '#805ad5', gray: '#718096' };

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mkey = d => dkey(d).slice(0, 7);
const today = () => dkey();
function addDays(ds, n) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return dkey(d); }
function monthShift(m, delta) { const [y, mo] = m.split('-').map(Number); return mkey(new Date(y, mo - 1 + delta, 1)); }
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
function fmtDate(ds) { if (!ds) return ''; const d = new Date(ds.length > 10 ? ds : ds + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtDT(s) { if (!s) return ''; const d = new Date(s); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + fmtTimeD(d); }
function fmtTimeD(d) { let h = d.getHours(); const m = pad(d.getMinutes()); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${m} ${ap}`; }
function fmtMin(m) { if (m == null || Number.isNaN(m)) return '--:--'; m = ((m % 1440) + 1440) % 1440; const d = new Date(2000, 0, 1, Math.floor(m / 60), m % 60); return fmtTimeD(d); }
function money(m, signed) {
  m = m || 0; const neg = m < 0; const a = Math.abs(m);
  const s = (a / 100).toLocaleString('en-US', { minimumFractionDigits: a % 100 ? 2 : 0, maximumFractionDigits: 2 });
  return (neg ? '-' : signed ? '+' : '') + S.settings.currency + ' ' + s;
}
function countdown(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}h ${pad(Math.floor(s % 3600 / 60))}m ${pad(s % 60)}s`; }

/* ---------- state ---------- */
let S = null;
function emptyState() {
  const s = {
    schema: SCHEMA, seq: {}, savedAt: 0, alerted: {},
    settings: {
      name: 'Abdul Hanan', currency: 'Rs', theme: 'system', city: 'Shahdadpur', lat: 25.925, lng: 68.623,
      method: 'Karachi', asr: 'hanafi', prayerAlerts: false, lastBackup: null
    }
  };
  COLL.forEach(c => s[c] = []);
  return s;
}
function seed(s) {
  const id = t => (s.seq[t] = (s.seq[t] || 0) + 1);
  s.accounts.push({ id: id('accounts'), name: 'Cash', type: 'cash', opening: 0, archived: false });
  CATS_INC.forEach(n => s.categories.push({ id: id('categories'), name: n, kind: 'income', archived: false }));
  CATS_EXP.forEach(n => s.categories.push({ id: id('categories'), name: n, kind: 'expense', archived: false }));
  return s;
}
function migrate(d) {
  const s = emptyState();
  Object.assign(s.settings, d.settings || {});
  COLL.forEach(c => { s[c] = Array.isArray(d[c]) ? d[c] : []; });
  s.alerted = d.alerted || {}; s.savedAt = d.savedAt || 0; s.seq = Object.assign({}, d.seq || {});
  COLL.forEach(c => { const mx = s[c].reduce((m, x) => Math.max(m, x.id || 0), 0); s.seq[c] = Math.max(s.seq[c] || 0, mx); });
  s.schema = SCHEMA;
  return s;
}
const byId = (c, id) => S[c].find(x => x.id === +id);
function nid(c) { S.seq[c] = (S.seq[c] || 0) + 1; return S.seq[c]; }
function add(c, o) { o.id = nid(c); S[c].push(o); commit(); return o; }
function upd(c, id, patch) { Object.assign(byId(c, id), patch); commit(); }
function rm(c, id) { S[c] = S[c].filter(x => x.id !== +id); commit(); }

/* ---------- persistence: IndexedDB + localStorage mirror ---------- */
function idb() {
  return new Promise((res, rej) => {
    if (typeof indexedDB === 'undefined') return rej(new Error('no idb'));
    const r = indexedDB.open('personal_erp', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function loadState() {
  let a = null, b = null;
  try { a = await idbGet('state'); } catch (e) { }
  try { const raw = localStorage.getItem('perp_state'); if (raw) b = JSON.parse(raw); } catch (e) { }
  const best = [a, b].filter(Boolean).sort((x, y) => (y.savedAt || 0) - (x.savedAt || 0))[0];
  return best ? migrate(best) : seed(emptyState());
}
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
async function saveNow() {
  clearTimeout(saveTimer); if (!S) return; S.savedAt = Date.now();
  const json = JSON.stringify(S);
  try { await idbSet('state', JSON.parse(json)); } catch (e) { }
  try { localStorage.setItem('perp_state', json); } catch (e) { }
}
function commit() { scheduleSave(); render(); }

/* ---------- toast / sheet / forms ---------- */
function toast(msg, cls = '') {
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
function openSheet(html) { $('#sheet').innerHTML = html; $('#sheetWrap').hidden = false; document.body.classList.add('noscroll'); }
function closeSheet() { $('#sheetWrap').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('noscroll'); FORM = null; }
let FORM = null;
function fieldHtml(f, v) {
  const id = 'f_' + f.n, req = f.req ? ' required' : '', val = v == null ? '' : v;
  let inp;
  if (f.t === 'checkbox') return `<label class="chk"><input type="checkbox" id="${id}"${v ? ' checked' : ''}> ${esc(f.l)}</label>`;
  if (f.t === 'textarea') inp = `<textarea id="${id}" rows="${f.rows || 3}"${req}>${esc(val)}</textarea>`;
  else if (f.t === 'select') inp = `<select id="${id}">${f.o.map(([k, l]) => `<option value="${esc(k)}"${String(k) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (f.t === 'money') inp = `<input id="${id}" type="number" inputmode="decimal" step="0.01" min="0"${req} value="${val === '' ? '' : val / 100}">`;
  else if (f.t === 'number') inp = `<input id="${id}" type="number" inputmode="decimal" step="${f.step || 'any'}"${req} value="${esc(val)}">`;
  else inp = `<input id="${id}" type="${f.t || 'text'}"${req} value="${esc(val)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.list ? ` list="dl_${f.n}"` : ''}>` +
    (f.list ? `<datalist id="dl_${f.n}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '');
  return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function openForm(o) {
  FORM = o; const vals = o.values || {};
  openSheet(`<form id="sheetForm" novalidate><div class="sh-h"><h2>${esc(o.title)}</h2><button type="button" class="icon" data-act="closeSheet">✕</button></div>` +
    (o.intro ? `<p class="sub">${o.intro}</p>` : '') +
    o.fields.map(f => fieldHtml(f, vals[f.n])).join('') +
    `<div class="sh-f">${o.onDelete ? '<button type="button" class="btn danger" data-act="formDelete">Delete</button>' : ''}<button type="submit" class="btn primary">${esc(o.submit || 'Save')}</button></div></form>`);
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'sheetForm') return;
  e.preventDefault(); if (!FORM) return;
  const vals = {};
  for (const f of FORM.fields) {
    const el = document.getElementById('f_' + f.n); let v;
    if (f.t === 'checkbox') v = el.checked;
    else {
      v = el.value.trim();
      if (f.t === 'money') { v = v === '' ? null : Math.round(parseFloat(v) * 100); if (Number.isNaN(v)) v = null; }
      else if (f.t === 'number') { v = v === '' ? null : parseFloat(v); if (Number.isNaN(v)) v = null; }
    }
    if (f.req && (v === '' || v === null)) { toast(f.l + ' is required'); el.focus(); return; }
    vals[f.n] = v;
  }
  if (FORM.onSubmit(vals) === false) return;
  closeSheet();
});

/* =====================================================================
   Prayer times (astronomical calculation, works fully offline)
   ===================================================================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const sinD = d => Math.sin(d * D2R), cosD = d => Math.cos(d * D2R), tanD = d => Math.tan(d * D2R);
const asinD = x => Math.asin(x) * R2D, acosD = x => Math.acos(x) * R2D, atan2D = (y, x) => Math.atan2(y, x) * R2D, acotD = x => Math.atan(1 / x) * R2D;
const fixN = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
const fixAngle = a => fixN(a, 360), fixHour = a => fixN(a, 24);
const METHODS = {
  Karachi: { label: 'Karachi (Univ. of Islamic Sciences)', fajr: 18, isha: 18 },
  MWL: { label: 'Muslim World League', fajr: 18, isha: 17 },
  ISNA: { label: 'ISNA (North America)', fajr: 15, isha: 15 },
  Egypt: { label: 'Egyptian General Authority', fajr: 19.5, isha: 17.5 },
  Makkah: { label: 'Umm al-Qura (Makkah)', fajr: 18.5, ishaMin: 90 }
};
function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPos(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D), q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * sinD(g) + 0.020 * sinD(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = fixHour(atan2D(cosD(e) * sinD(L), cosD(L)) / 15);
  return { decl: asinD(sinD(e) * sinD(L)), eqt: q / 15 - RA };
}
/** Returns minutes-from-midnight (local time) for each prayer + sunrise. */
function calcPrayerTimes(y, mo, d, lat, lng, tz, method, asrFactor) {
  const jd0 = julian(y, mo, d) - lng / (15 * 24), m = METHODS[method] || METHODS.Karachi;
  const P = t => sunPos(jd0 + t / 24), midDay = t => fixHour(12 - P(t).eqt);
  const angleTime = (ang, t, ccw) => {
    const decl = P(t).decl, x = (-sinD(ang) - sinD(decl) * sinD(lat)) / (cosD(decl) * cosD(lat));
    if (!(x >= -1 && x <= 1)) return NaN;
    const h = acosD(x) / 15; return midDay(t) + (ccw ? -h : h);
  };
  const asrT = (f, t) => angleTime(-acotD(f + tanD(Math.abs(lat - P(t).decl))), t, false);
  let T = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, maghrib: 18, isha: 18 };
  for (let i = 0; i < 2; i++) {
    const n = {};
    n.fajr = angleTime(m.fajr, T.fajr, true);
    n.sunrise = angleTime(0.833, T.sunrise, true);
    n.dhuhr = midDay(T.dhuhr);
    n.asr = asrT(asrFactor, T.asr);
    n.sunset = angleTime(0.833, T.sunset, false);
    n.maghrib = n.sunset;
    n.isha = m.ishaMin ? n.maghrib + m.ishaMin / 60 : angleTime(m.isha, T.isha, false);
    T = n;
  }
  const adj = tz - lng / 15, out = {};
  for (const k of Object.keys(T)) out[k] = Math.round((T[k] + adj) * 60);
  return out;
}
/** Times for a 'YYYY-MM-DD' day: manual timetable rows override calculated values. */
function prayerTimesFor(ds) {
  const [y, mo, d] = ds.split('-').map(Number), st = S.settings;
  const tz = -new Date(y, mo - 1, d, 12).getTimezoneOffset() / 60;
  const t = calcPrayerTimes(y, mo, d, +st.lat, +st.lng, tz, st.method, st.asr === 'hanafi' ? 2 : 1);
  const src = {};
  PRAYERS.forEach(p => {
    src[p] = 'auto';
    const row = S.schedules.filter(r => r.from <= ds && r[p]).sort((a, b) => b.from.localeCompare(a.from))[0];
    if (row) { const [h, mi] = row[p].split(':').map(Number); t[p] = h * 60 + mi; src[p] = 'manual'; }
  });
  t.src = src; return t;
}
function nextPrayer() {
  const now = new Date(), ds = dkey(now), nm = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const t = prayerTimesFor(ds);
  for (const p of PRAYERS) if (t[p] > nm) { const at = new Date(now); at.setHours(0, 0, 0, 0); at.setMinutes(t[p]); return { name: p, at }; }
  const tm = prayerTimesFor(addDays(ds, 1)), at = new Date(now); at.setDate(at.getDate() + 1); at.setHours(0, 0, 0, 0); at.setMinutes(tm.fajr);
  return { name: 'fajr', at };
}
const prayerLog = (ds, p) => S.prayerLogs.find(l => l.date === ds && l.prayer === p);
const prayerStatus = (ds, p) => (prayerLog(ds, p) || {}).status || '';
const isPrayed = s => s === 'ontime' || s === 'late';

function prayerStreak() {
  let n = 0, d = today();
  const full = x => PRAYERS.every(p => isPrayed(prayerStatus(x, p)));
  if (!full(d)) d = addDays(d, -1);
  while (full(d) && n < 3650) { n++; d = addDays(d, -1); }

}

function habitStats(h) {
  const logs = {}; S.habitLogs.filter(l => l.habitId === h.id).forEach(l => logs[l.date] = l.count);
  const done = d => (logs[d] || 0) >= h.target;
  let cur = 0, d = today(); if (!done(d)) d = addDays(d, -1);

/* ---------- Health & Fitness ---------- */
function lineChart(pts) {
  if (pts.length < 2) return emptyBox('Add at least two entries to see a trend.');
  const W = 300, H = 110, p = 10, ys = pts.map(x => x.y), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx - mn) || 1;
  const xy = pts.map((q, i) => [p + i * (W - 2 * p) / (pts.length - 1), H - p - (q.y - mn) / rg * (H - 2 * p)]);
  return `<svg class="line" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${xy.map(q => q.join(',')).join(' ')}"/>${xy.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.2" fill="var(--gold)"/>`).join('')}</svg><div class="sub" style="display:flex;justify-content:space-between"><span>${fmtDate(pts[0].x)} · min ${mn}</span><span>${fmtDate(pts[pts.length - 1].x)} · max ${mx}</span></div>`;
}

/* =====================================================================
   Global search
   ===================================================================== */
function searchResults(q) {
  q = (q || '').trim().toLowerCase();
  if (q.length < 2) return emptyBox('Type at least 2 letters.');
  const has = (...f) => f.some(x => x != null && String(x).toLowerCase().includes(q)), out = [];
  const push = (type, ico, t, s, act, id) => out.push({ type, ico, t, s, act, id });
  S.txns.forEach(x => { if (has(x.note, catName(x.categoryId), accName(x.accountId), contactName(x.contactId), x.amount / 100)) push('Transaction', '💰', (catName(x.categoryId) || x.kind) + ' · ' + money(x.amount), fmtDate(x.date) + (x.note ? ' · ' + x.note : ''), 'editTxn', x.id); });
  S.tasks.forEach(x => { if (has(x.title, x.notes)) push('Task', '✅', x.title, STAT_LABEL[x.status], 'editTask', x.id); });
  S.projects.forEach(x => { if (has(x.name, x.description)) push('Project', '📁', x.name, x.status, 'editProject', x.id); });
  S.journal.forEach(x => { if (has(x.title, x.body, x.tags)) push('Journal', '📝', x.title || x.body.slice(0, 50), fmtDate(x.date), 'editJournal', x.id); });
  S.books.forEach(x => { if (has(x.title, x.author, x.notes)) push('Book', '📖', x.title, x.author || '', 'editBook', x.id); });
  S.ideas.forEach(x => { if (has(x.title, x.body, x.tags)) push('Idea', '💡', x.title, (x.body || '').slice(0, 60), 'editIdea', x.id); });
  S.contacts.forEach(x => { if (has(x.name, x.phone, x.email, x.organization, x.relation, x.notes)) push('Contact', '👤', x.name, x.organization || x.phone || '', 'openContact', x.id); });
  S.interactions.forEach(x => { if (has(x.summary)) push('Interaction', '🗣️', x.summary, contactName(x.contactId) + ' · ' + fmtDate(x.date), 'openContact', x.contactId); });
  S.followUps.forEach(x => { if (has(x.note)) push('Follow-up', '🔔', x.note, contactName(x.contactId) + ' · ' + fmtDate(x.dueAt), 'openContact', x.contactId); });
  S.assets.forEach(x => { if (has(x.name, x.category, x.serial, x.location, x.notes)) push('Asset', '📦', x.name, [x.category, x.serial].filter(Boolean).join(' · '), 'editAsset', x.id); });
  S.workouts.forEach(x => { if (has(x.type, x.notes)) push('Workout', '🏋️', x.type, fmtDate(x.date), 'editWorkout', x.id); });
  S.habits.forEach(x => { if (has(x.name)) push('Habit', '🔥', x.name, '', 'editHabit', x.id); });
  S.accounts.forEach(x => { if (has(x.name)) push('Account', '🏦', x.name, money(accBalance(x.id)), 'editAccount', x.id); });
  if (!out.length) return emptyBox('Nothing found.');
  return `<div class="card">${out.slice(0, 60).map(o => rowHtml({ act: o.act, id: o.id, ico: o.ico, t: o.t, s: esc(o.s), r: chip(o.type) })).join('')}</div>${out.length > 60 ? `<div class="sub" style="text-align:center">Showing 60 of ${out.length}. Refine your search.</div>` : ''}`;
}
function viewSearch() {
  return { title: 'Search', html: `<div class="toolbar"><input id="q" data-input="q" type="search" placeholder="Search everything…" value="${esc(UI.q)}" autofocus></div><div id="results">${searchResults(UI.q)}</div>` };
}

/* =====================================================================
   Backup & Restore, Settings
   ===================================================================== */
const stamp = () => { const n = new Date(); return `${n.getFullYear()}${pad(n.getMonth() + 1)}${pad(n.getDate())}_${pad(n.getHours())}${pad(n.getMinutes())}${pad(n.getSeconds())}`; };
function backupPayload() { return { format: APP_FORMAT, formatVersion: 1, schemaVersion: SCHEMA, exportedAt: new Date().toISOString(), data: S }; }
function markBackedUp() { S.settings.lastBackup = new Date().toISOString(); commit(); }
function exportBackup() {
  const blob = new Blob([JSON.stringify(backupPayload())], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'personal_erp_backup_' + stamp() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); markBackedUp(); toast('Backup file created. Look in your Downloads folder.');
}
async function shareBackup() {
  try {
    const file = new File([JSON.stringify(backupPayload())], 'personal_erp_backup_' + stamp() + '.json', { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Personal ERP backup' }); markBackedUp(); }
    else toast('Sharing files is not supported here. Use "Save backup file".');
  } catch (e) { if (e && e.name !== 'AbortError') toast('Could not share. Use "Save backup file".'); }
}
async function keepSafetyCopy() {
  let ok = false; const json = JSON.stringify(S);
  try { await idbSet('safety', JSON.parse(json)); ok = true; } catch (e) { }
  try { localStorage.setItem('perp_safety', json); ok = true; } catch (e) { }
  if (ok) try { localStorage.setItem('perp_has_safety', '1'); } catch (e) { }
}
async function restoreFromText(text) {
  let j; try { j = JSON.parse(text); } catch (e) { toast('That file is not a readable backup.'); return; }
  if (!j || j.format !== APP_FORMAT || !j.data) { toast('This is not a Personal ERP (HTML) backup file.'); return; }
  if ((j.schemaVersion || 0) > SCHEMA) { toast('This backup is from a newer version of the app.'); return; }
  const d = migrate(j.data), counts = COLL.filter(c => d[c].length).map(c => c + ': ' + d[c].length).join('\n') || 'no records';
  if (!confirm('Replace ALL current data with this backup?\n\n' + counts + '\n\nA safety copy of your current data is kept first.')) return;
  await keepSafetyCopy(); S = d; applyTheme(); commit(); toast('Backup restored');
}
async function undoRestore() {
  let d = null; try { d = await idbGet('safety'); } catch (e) { }
  if (!d) try { const raw = localStorage.getItem('perp_safety'); if (raw) d = JSON.parse(raw); } catch (e) { }
  if (!d) { toast('No safety copy found.'); return; }
  if (!confirm('Go back to the data you had before the last restore or reset?')) return;
  S = migrate(d); applyTheme(); commit(); toast('Previous data restored');
}
function viewBackup() {
  const st = S.settings, size = Math.round(JSON.stringify(S).length / 1024);
  let h = `<div class="card"><div class="sub">Last backup</div><div style="font-size:20px;font-weight:800">${st.lastBackup ? fmtDT(st.lastBackup) : 'Never'}</div><div class="sub" style="margin-top:8px">Your data lives only on this device (${size} KB). If the phone is lost, reset, or the browser data is cleared, a backup file is the only way to get it back. Keep copies somewhere other than this phone.</div></div>`;
  h += `<button class="btn primary block" data-act="exportBackup">💾 Save backup file</button>`;
  if (navigator.canShare) h += `<button class="btn block" data-act="shareBackup">📤 Share backup file (Drive, WhatsApp…)</button>`;
  h += `<button class="btn block" data-act="restorePick">♻️ Restore from file</button><input type="file" id="restoreFile" accept=".json,application/json" hidden>`;
  let hasSafety = false; try { hasSafety = !!localStorage.getItem('perp_has_safety'); } catch (e) { }
  if (hasSafety) h += `<button class="btn block" data-act="undoRestore">↩️ Undo last restore / reset</button>`;
  h += `<div class="card" style="margin-top:16px"><h3>Danger zone</h3><div class="sub" style="margin-bottom:8px">Deletes everything in the app. A safety copy is kept so you can undo.</div><button class="btn danger block" data-act="resetAll">Erase all data</button></div>`;
  return { title: 'Backup & Restore', html: h };
}
function viewSettings() {
  const st = S.settings; let perm = 'not supported here'; try { if ('Notification' in window) perm = Notification.permission; } catch (e) { }
  const seg = ['system', 'light', 'dark'].map(v => `<button class="${st.theme === v ? 'on' : ''}" data-act="theme" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('');
  return {
    title: 'Settings', html: `<div class="card"><h3>Theme</h3><div class="seg" style="margin:0">${seg}</div></div>` +
      `<div class="card"><div class="kv"><span>Name</span><b>${esc(st.name)}</b></div><div class="kv"><span>Currency symbol</span><b>${esc(st.currency)}</b></div><button class="btn block" style="margin-top:10px" data-act="editProfile">Edit name & currency</button></div>` +
      `<div class="card"><h3>Reminders</h3><div class="sub">Reminders and prayer alerts appear while this app is open on screen. A web page cannot wake your phone in the background.</div><div class="kv" style="margin-top:8px"><span>Notification permission</span><b>${perm}</b></div><button class="btn block" style="margin-top:10px" data-act="notifPerm">Allow notifications</button></div>` +
      `<div class="card"><h3>Storage</h3><div class="sub">Everything is saved in this browser on this device. Nothing is uploaded. Ask the browser to protect the data from automatic cleanup:</div><button class="btn block" style="margin-top:10px" data-act="persist">Request persistent storage</button></div>` +
      `<div class="card"><div class="sub">Personal ERP · offline-first · data format v${SCHEMA}</div></div>`
  };
}

/* =====================================================================
   Actions (event delegation: any element with data-act)
   ===================================================================== */
const A = {
  nav: d => { UI.pday = null; go(d.to); },
  go: d => go(d.to),
  back: () => { const r = parseRoute(); if (r.name === 'contact') go('p/contacts'); else if (r.name === 'p') go('more'); else history.back(); },
  closeSheet: () => closeSheet(),
  formDelete: () => { if (FORM && FORM.onDelete && confirm('Delete this? This cannot be undone.')) { FORM.onDelete(); closeSheet(); } },
  sub: d => { UI.sub[d.k] = d.v; render(); },
  month: d => { UI.month = monthShift(UI.month, +d.d); render(); },
  pday: d => { UI.pday = addDays(UI.pday || today(), +d.d); render(); },
  pdayToday: () => { UI.pday = null; render(); },
  theme: d => { S.settings.theme = d.v; applyTheme(); commit(); },
  // finance
  fabFinance: () => openSheet(`<div class="sh-h"><h2>Add</h2><button class="icon" data-act="closeSheet">✕</button></div><button class="btn block" data-act="txnNew" data-k="expense">⬆️ Expense</button><button class="btn block" data-act="txnNew" data-k="income">⬇️ Income</button><button class="btn block" data-act="txnNew" data-k="transfer">🔁 Transfer between accounts</button>`),
  txnNew: d => txnForm(d.k),
  qExpense: () => txnForm('expense'), qIncome: () => txnForm('income'), qTask: () => taskForm(), qJournal: () => journalForm(),
  editTxn: d => txnForm(null, +d.id),
  newAccount: () => accountForm(), editAccount: d => accountForm(+d.id),
  newCategory: d => categoryForm(d.kind), editCategory: d => categoryForm(null, +d.id),
  // tasks
  newTask: () => taskForm(), editTask: d => taskForm(+d.id),
  doneTask: d => { const t = byId('tasks', d.id); upd('tasks', t.id, t.status === 'done' ? { status: 'todo', completedAt: '' } : { status: 'done', completedAt: new Date().toISOString() }); },
  moveTask: d => {
    const t = byId('tasks', d.id), i = STAT_ORDER.indexOf(t.status) + +d.d; if (i < 0 || i > 2) return;
    upd('tasks', t.id, { status: STAT_ORDER[i], completedAt: STAT_ORDER[i] === 'done' ? new Date().toISOString() : '' });
  },
  projects: () => openSheet(`<div class="sh-h"><h2>Projects</h2><button class="icon" data-act="closeSheet">✕</button></div>${S.projects.map(p => rowHtml({ act: 'editProject', id: p.id, ico: '📁', t: p.name, s: esc(p.status) + ' · ' + S.tasks.filter(t => t.projectId === p.id).length + ' tasks' })).join('') || emptyBox('No projects yet.')}<button class="btn primary block" style="margin-top:10px" data-act="newProject">+ New project</button>`),
  newProject: () => projectForm(), editProject: d => projectForm(+d.id),
  // namaz
  setPrayer: d => setPrayer(d.d, d.p, d.s),
  prayerSettings: () => prayerSettingsForm(),
  newSchedule: () => scheduleForm(), editSchedule: d => scheduleForm(+d.id),
  gps: () => {
    if (!navigator.geolocation) return toast('GPS is not available here.');
    toast('Getting your location…');
    navigator.geolocation.getCurrentPosition(p => { S.settings.city = 'Custom'; S.settings.lat = +p.coords.latitude.toFixed(4); S.settings.lng = +p.coords.longitude.toFixed(4); commit(); toast('Location updated'); },
      () => toast('Could not get your location. Choose a city instead.'), { timeout: 15000 });
  },
  // knowledge / health / habits
  newJournal: () => journalForm(), editJournal: d => journalForm(+d.id),
  newBook: () => bookForm(), editBook: d => bookForm(+d.id),
  newIdea: () => ideaForm(), editIdea: d => ideaForm(+d.id),
  newWorkout: () => workoutForm(), editWorkout: d => workoutForm(+d.id),
  newMetric: () => metricForm(), editMetric: d => metricForm(+d.id),
  metricType: d => { UI.metric = d.v; render(); },
  newHabit: () => habitForm(), editHabit: d => habitForm(+d.id),
  habitInc: d => { const h = byId('habits', d.id), c = habitCount(h.id, today()); setHabitCount(h.id, today(), c >= h.target && h.target === 1 ? 0 : c + 1); },
  habitDec: d => setHabitCount(+d.id, today(), habitCount(+d.id, today()) - 1),
  // contacts
  openContact: d => go('contact/' + d.id),
  newContact: () => contactForm(), editContact: d => contactForm(+d.id),
  newInteraction: () => interactionForm(parseRoute().arg), editInteraction: d => interactionForm(byId('interactions', d.id).contactId, +d.id),
  newFollowUp: () => followUpForm(parseRoute().arg), editFollowUp: d => followUpForm(byId('followUps', d.id).contactId, +d.id),
  doneFollowUp: d => { const x = byId('followUps', d.id); upd('followUps', x.id, { doneAt: x.doneAt ? '' : today() }); },
  newAsset: () => assetForm(), editAsset: d => assetForm(+d.id),
  // backup & settings
  exportBackup: () => exportBackup(), shareBackup: () => shareBackup(),
  restorePick: () => { const f = $('#restoreFile'); if (f) f.click(); },
  undoRestore: () => undoRestore(),
  resetAll: async () => {
    if (!confirm('Erase ALL data in this app?')) return;
    if (!confirm('Are you sure? Everything will be deleted (a safety copy is kept so you can undo).')) return;
    await keepSafetyCopy(); S = seed(emptyState()); applyTheme(); commit(); toast('All data erased');
  },
  editProfile: () => openForm({
    title: 'Name & currency', fields: [{ n: 'name', l: 'Your name', req: true }, { n: 'currency', l: 'Currency symbol (e.g. Rs, PKR, $)', req: true }], values: S.settings,
    onSubmit(v) { S.settings.name = v.name; S.settings.currency = v.currency; commit(); }
  }),
  notifPerm: () => {
    try {
      if (!('Notification' in window)) return toast('Notifications are not supported here.');
      Notification.requestPermission().then(p => { toast('Notification permission: ' + p); render(); });
    } catch (e) { toast('Notifications are not supported here.'); }
  },
  persist: () => {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => toast(ok ? 'Storage is now protected' : 'The browser declined. Keep regular backups.'));
    else toast('Not supported in this browser. Keep regular backups.');
  },
  rmAlert: (d, el) => el.remove()
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || !A[el.dataset.act]) return;
  ev.preventDefault(); A[el.dataset.act](el.dataset, el, ev);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'projFilter') { UI.projFilter = el.value; render(); }
  else if (el.dataset.change === 'accFilter') { UI.accFilter = el.value; render(); }
  else if (el.id === 'restoreFile' && el.files && el.files[0]) { const f = el.files[0]; el.value = ''; f.text().then(restoreFromText).catch(() => toast('Could not read that file.')); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'q') { UI.q = el.value; $('#results').innerHTML = searchResults(el.value); }
  else if (el.dataset.input === 'cq') { UI.cq = el.value; $('#clist').innerHTML = contactList(); }
});

/* =====================================================================
   Alerts (only while the app is open) and clock
   ===================================================================== */
function notify(title, body) {
  const b = $('#banner'); const el = document.createElement('div');
  el.className = 'toast alert'; el.dataset.act = 'rmAlert'; el.textContent = '🔔 ' + title + (body ? ': ' + body : '');
  b.appendChild(el); setTimeout(() => el.remove(), 30000);
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) { }
}
function checkAlerts() {
  if (!S) return;
  const now = new Date(), ds = dkey(now), nm = now.getHours() * 60 + now.getMinutes(); let dirty = false;
  Object.keys(S.alerted).forEach(k => { if (!k.startsWith(ds)) { delete S.alerted[k]; dirty = true; } });
  if (S.settings.prayerAlerts) {
    const t = prayerTimesFor(ds);
    PRAYERS.forEach(p => { const k = `${ds}:pray:${p}`; if (!S.alerted[k] && nm >= t[p] && nm < t[p] + 10) { S.alerted[k] = 1; dirty = true; notify('Time for ' + PNAME[p], fmtMin(t[p])); } });
  }
  S.tasks.forEach(tk => { if (tk.remindAt && !tk.reminded && tk.status !== 'done' && new Date(tk.remindAt) <= now) { tk.reminded = true; dirty = true; notify('Task reminder', tk.title); } });
  S.habits.forEach(hb => {
    if (!hb.remindTime || hb.archivedAt) return;
    const [h, m] = hb.remindTime.split(':').map(Number), k = `${ds}:habit:${hb.id}`;
    if (!S.alerted[k] && nm >= h * 60 + m && nm < h * 60 + m + 30 && habitCount(hb.id, ds) < hb.target) { S.alerted[k] = 1; dirty = true; notify('Habit reminder', hb.name); }
  });
  if (dirty) scheduleSave();
}
let tickN = 0, lastDay = dkey();
function tick() {
  if (!S) return;
  const el = $('#cd');
  if (el) { const n = nextPrayer(); if (el.dataset.p && el.dataset.p !== n.name) render(); else el.textContent = countdown(n.at - Date.now()); }
  if (dkey() !== lastDay) { lastDay = dkey(); render(); }
  if (++tickN % 15 === 0) checkAlerts();
}

/* =====================================================================
   Start
   ===================================================================== */
(async function init() {
  S = await loadState(); applyTheme();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  window.addEventListener('hashchange', render);
  window.addEventListener('pagehide', () => saveNow());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  saveNow(); render(); setInterval(tick, 1000); checkAlerts();
})();
</script>
